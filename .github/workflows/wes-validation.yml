name: WES project validation

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "workflow/**"
      - "README.md"
      - ".github/workflows/wes-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required project files
        run: |
          test -f workflow/main.nf
          test -f config/samplesheet.csv
          test -f scripts/summarize_variants.py
          test -f scripts/validate_samplesheet.py
          test -f scripts/run_sarek.sh
      - name: Check shell and Python syntax
        run: |
          bash -n scripts/run_sarek.sh
          bash -n scripts/prepare_curated_results.sh
          python -m py_compile scripts/summarize_variants.py scripts/validate_samplesheet.py
      - name: Validate matched tumor-normal sample sheet
        run: python scripts/validate_samplesheet.py --samplesheet config/samplesheet.csv
      - name: Check JSON configuration
        run: python -m json.tool config/sarek_params.json > /dev/null
